<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Menu</title>
    <link rel="stylesheet" href="Resturantmenu.css">
</head>

<body>

<h1>🍽 Restaurant Menu</h1>

<div class="menu">
    <h2>Menu</h2>

    <div class="item">
        <span>Burger - $8.99</span>
        <button onclick="addItem('Burger', 8.99)">Add</button>
    </div>

    <div class="item">
        <span>Pizza - $12.50</span>
        <button onclick="addItem('Pizza', 12.50)">Add</button>
    </div>

    <div class="item">
        <span>Pasta - $10.75</span>
        <button onclick="addItem('Pasta', 10.75)">Add</button>
    </div>

    <div class="item">
        <span>Salad - $6.50</span>
        <button onclick="addItem('Salad', 6.50)">Add</button>
    </div>

    <div class="item">
        <span>Soda - $2.00</span>
        <button onclick="addItem('Soda', 2.00)">Add</button>
    </div>
</div>

<div class="order">
    <h2>Your Order</h2>

    <div class="discount-section">
        <label for="promoCode">Promo Code:</label>
        <input type="text" id="promoCode" placeholder="Enter code (e.g. SAVE10)">
        <button onclick="applyPromo()">Apply</button>
    </div>

    <div class="tip-section">
        <label for="tipPercent">Tip %:</label>
        <input type="number" id="tipPercent" placeholder="Enter tip %" min="0" max="100">
        <button onclick="applyTip()">Apply Tip</button>
    </div>

    <ul id="orderList"></ul>

    <div class="total">
        Subtotal: $<span id="subtotal">0.00</span><br>
        Tax (8%): $<span id="taxAmount">0.00</span><br>
        Discount: -<span id="discountAmount">$0.00</span><br>
        Tip: $<span id="tipAmount">0.00</span><br>
        <strong>Total: $<span id="total">0.00</span></strong>
    </div>

    <button class="danger" onclick="clearOrder()">Clear Order</button>
    <button class="checkout" onclick="checkout()">Checkout</button>
</div>

<script>
let orderItems = {};
let discountRate = 0;
let tipRate = 0;

function addItem(name, price) {
    if (!orderItems[name]) {
        orderItems[name] = { price: price, quantity: 1 };
    } else {
        orderItems[name].quantity++;
    }
    renderOrder();
}

function increaseItem(name) {
    orderItems[name].quantity++;
    renderOrder();
}

function decreaseItem(name) {
    orderItems[name].quantity--;
    if (orderItems[name].quantity <= 0) {
        delete orderItems[name];
    }
    renderOrder();
}

function removeItem(name){
    delete orderItems[name];
    renderOrder();
}

function applyPromo() {
    const code = document.getElementById("promoCode").value.trim().toUpperCase();
    if (code === "SAVE10") {
        discountRate = 0.10;
        alert("10% discount applied!");
    } else if (code === "SAVE20") {
        discountRate = 0.20;
        alert("20% discount applied!");
    } else {
        discountRate = 0;
        alert("Invalid promo code!");
    }
    renderOrder();
}

function applyTip() {
    const tipInput = parseFloat(document.getElementById("tipPercent").value);
    if (!isNaN(tipInput) && tipInput >= 0) {
        tipRate = tipInput / 100;
    } else {
        tipRate = 0;
    }
    renderOrder();
}

function clearOrder() {
    orderItems = {};
    discountRate = 0;
    tipRate = 0;
    document.getElementById("promoCode").value = "";
    document.getElementById("tipPercent").value = "";
    renderOrder();
}

function checkout() {
    if (Object.keys(orderItems).length === 0) {
        alert("Your order is empty!");
        return;
    }

    let receipt = "🧾 Receipt\n\n";
    let subtotal = 0;

    for (let name in orderItems) {
        let item = orderItems[name];
        let itemTotal = item.price * item.quantity;
        receipt += `${name} x${item.quantity} - $${itemTotal.toFixed(2)}\n`;
        subtotal += itemTotal;
    }

    let tax = subtotal * 0.08;
    let discount = subtotal * discountRate;
    let tip = subtotal * tipRate;
    let total = (subtotal + tax + tip) - discount;
    let date = new Date();

    receipt += "\n----------------------\n";
    receipt += `Subtotal: $${subtotal.toFixed(2)}\n`;
    receipt += `Tax (8%): $${tax.toFixed(2)}\n`;
    if (discountRate > 0) {
        receipt += `Discount: -$${discount.toFixed(2)}\n`;
    }
    if (tipRate > 0) {
        receipt += `Tip: $${tip.toFixed(2)}\n`;
    }
    receipt += `Total: $${total.toFixed(2)}\n`;
    receipt += `Date: ${date.toLocaleString()}\n`;
    receipt += "Thank you! 🍽";

    alert(receipt);
    clearOrder();
}

function renderOrder() {
    const list = document.getElementById("orderList");
    list.innerHTML = "";

    let subtotal = 0;

    for (let name in orderItems) {
        const item = orderItems[name];
        const li = document.createElement("li");
        li.innerHTML = `
            ${name} x${item.quantity} - $${(item.price * item.quantity).toFixed(2)}
            <span class="controls">
                <button onclick="increaseItem('${name}')">+</button>
                <button onclick="decreaseItem('${name}')">-</button>
                <button onclick="removeItem('${name}')">Remove</button>
            </span>
        `;
        list.appendChild(li);
        subtotal += item.price * item.quantity;
    }

    let tax = subtotal * 0.08;
    let discount = subtotal * discountRate;
    let tip = subtotal * tipRate;
    let total = (subtotal + tax + tip) - discount;

    document.getElementById("subtotal").textContent = subtotal.toFixed(2);
    document.getElementById("taxAmount").textContent = tax.toFixed(2);
    document.getElementById("discountAmount").textContent = `$${discount.toFixed(2)}`;
    document.getElementById("tipAmount").textContent = tip.toFixed(2);
    document.getElementById("total").textContent = total.toFixed(2);
}
</script>

</body>
</html>
